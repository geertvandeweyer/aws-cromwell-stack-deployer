# Copy to configuration.ini and edit for the target deployment. Do not add secrets.
# All sections and options are read by the shared configuration loader.

[deployment]
namespace = cromwell-prod

[network]
vpc_id = vpc-0123456789abcdef0
private_subnet_ids = subnet-aaaaaaaa, subnet-bbbbbbbb

[access]
public_access = false
allowed_cidrs =

[storage]
existing_bucket = false
removal_policy = RETAIN
encryption = SSE_KMS

[additional_s3_buckets]
; Declare sequential bucketN entries. Each grant applies to Batch worker instances.
; Full grants object-level read/write/delete, not bucket administration.
; bucket1_name = shared-inputs
; bucket1_prefix = cohort-a/
; bucket1_access = readonly

[efs]
create = false
existing_file_system_ids =

[fsx]
create = false
storage_type = SSD
storage_capacity_gib = 1200
per_unit_throughput = 200

[mountpoint_s3]
primary_bucket_mount = false
mount1_bucket =
mount1_prefix =
mount1_access_mode = ro
mount2_bucket =
mount2_prefix =
mount2_access_mode = ro
mount3_bucket =
mount3_prefix =
mount3_access_mode = ro
mount4_bucket =
mount4_prefix =
mount4_access_mode = ro
mount5_bucket =
mount5_prefix =
mount5_access_mode = ro
best_effort_mounts = false

[batch]
default_use_spot = true
priority_use_spot = false
default_min_vcpus = 0
default_max_vcpus = 256
priority_min_vcpus = 0
priority_max_vcpus = 64
instance_types = m5.large, m5.xlarge
spot_bid_percentage = 100

[artifacts]
verify_checksums = true
artifact_bucket_removal_policy = RETAIN

[cromwell]
hosted = false
instance_type = t3.large
version = 92
# Optional source override: set exactly one of artifact_url or artifact_path.
# Custom sources require sha256. artifact_url must use HTTPS.
artifact_url =
artifact_path =
sha256 =
tls_certificate_arn =

[database]
hosted = false
standalone_ok = false
engine_version =
min_acu = 0.5
max_acu = 8
removal_policy = SNAPSHOT

[external]
source_cidrs =
ports =

[observability]
log_retention_days = 30
